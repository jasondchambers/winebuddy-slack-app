[project]
name = "winebuddy-slack-app"
version = "0.1.0"
description = "Slack bot that answers questions about a wine cellar using the Claude API and the winebuddy CLI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.8.0",
    "slack-bolt>=1.27.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-bdd>=9.0.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*"]
relative_files = true
